# Builds markerlite.exe on a Windows runner and attaches it to the run.
# Push this repo to GitHub, open Actions, run the workflow, download the
# artifact. No local Windows build needed - useful for handing a binary to
# blog readers who will not install Python.
name: build-windows-exe

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Tesseract in its default directory
        run: choco install tesseract --yes --no-progress

      - name: Check generated agent instructions
        shell: bash
        run: |
          python tools/sync_agents.py
          git diff --exit-code AGENTS.md

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-lock.txt -e ".[dev,gui,build]"

      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$(python -c 'import markerlite; print(markerlite.__version__)')" = "${GITHUB_REF_NAME#v}"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Discover Tesseract without PATH
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'Tesseract-OCR|chocolatey\\bin' }) -join ';'
          if (Get-Command tesseract -ErrorAction SilentlyContinue) { throw "tesseract unexpectedly remains on PATH" }
          python markerlite_gui.py --diag
          Select-String -Path markerlite-diag.txt -Pattern "tesseract.*path=.*Tesseract-OCR"
          python -c "import pathlib,tempfile,markerlite; d=tempfile.TemporaryDirectory(); _,i=markerlite.convert(pathlib.Path('tests/fixtures/scanned.pdf'), pathlib.Path(d.name)); assert i['stats']['ocr_pages'] == 2; assert i['stats']['words'] > 100"
          Remove-Item markerlite-diag.txt

      - name: Check GUI method references
        run: python check_gui.py

      - name: Fixture regression
        # Converts tests/fixtures/*.pdf and diffs against tests/expected/.
        # Tesseract is installed above, so Windows also checks OCR output.
        run: python tests/regress.py

      - name: Golden fixture hashes
        run: python tests/golden.py verify --scope fixtures

      - name: Build
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name markerlite `
            --collect-all tkinterdnd2 `
            --collect-submodules sklearn `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --add-data "markerlite.py;." `
            --add-data "markerlite/VERSION;markerlite" `
            --add-data "table_recon.py;." `
            markerlite_gui.py

      - name: Smoke test the converter
        run: python -c "import markerlite; print('import ok')"

      - name: Check the build launches
        run: |
          if (!(Test-Path dist\markerlite\markerlite.exe)) { throw "exe missing" }
          $diag = Start-Process -FilePath dist\markerlite\markerlite.exe -ArgumentList "--diag" -Wait -PassThru
          if ($diag.ExitCode -ne 0) { throw "diagnostics exited $($diag.ExitCode)" }
          if (!(Test-Path dist\markerlite\markerlite-diag.txt)) { throw "diagnostics missing" }
          Select-String -Path dist\markerlite\markerlite-diag.txt -Pattern "frozen=True", "TkinterDnD.Tk\(\)  OK"

      - name: Check embedded icon resources
        run: python tools/check_exe_icon.py dist\markerlite\markerlite.exe assets\icon.ico

      - name: Ship license texts with the build
        # Apache-2.0 requires the license and NOTICE to accompany redistributions.
        run: |
          Copy-Item LICENSE, NOTICE, README.md -Destination dist\markerlite\
          New-Item -ItemType Directory -Force dist\markerlite\third_party\marker | Out-Null
          Copy-Item third_party\marker\LICENSE -Destination dist\markerlite\third_party\marker\

      - name: Zip the folder build
        run: Compress-Archive -Path dist\markerlite -DestinationPath markerlite-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: markerlite-windows
          path: markerlite-windows.zip
          if-no-files-found: error

      # A run artifact is not a download link: it expires and needs a GitHub
      # login to fetch. On a version tag, attach the zip to a Release so the
      # Releases page carries something a reader can actually click.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Windows build. Unzip, run markerlite.exe from inside the folder. Windows SmartScreen will warn once: click More info, then Run anyway. Scanned PDFs need Tesseract installed separately; digital PDFs do not."
          # Idempotent: if a release for this tag already exists (created by
          # hand, or by an earlier attempt), replace its zip rather than fail.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag markerlite-windows.zip --clobber
          } else {
            gh release create $tag markerlite-windows.zip --title "markerlite $tag" --notes $notes --latest
          }
