# Builds markerlite.exe on a Windows runner and attaches it to the run.
# Push this repo to GitHub, open Actions, run the workflow, download the
# artifact. No local Windows build needed - useful for handing a binary to
# blog readers who will not install Python.
name: build-windows-exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pymupdf scikit-learn rapidfuzz regex numpy tkinterdnd2

      - name: Build
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name markerlite `
            --collect-all tkinterdnd2 `
            --collect-submodules sklearn `
            --add-data "markerlite.py;." `
            --add-data "table_recon.py;." `
            markerlite_gui.py

      - name: Smoke test the converter
        run: python -c "import markerlite; print('import ok')"

      - name: Check the build launches
        # --windowed builds print nothing, so just confirm the exe and its
        # bundled runtime are present and the entry point resolves.
        run: |
          if (!(Test-Path dist\markerlite\markerlite.exe)) { throw "exe missing" }
          Get-ChildItem dist\markerlite | Measure-Object | Select-Object -Expand Count

      - uses: actions/upload-artifact@v5
        with:
          name: markerlite-windows
          # A folder build: markerlite.exe plus its DLLs beside it. Less prone
          # to antivirus false positives than a self-extracting single file,
          # and it starts in about a second instead of several.
          path: dist/markerlite/
          if-no-files-found: error
