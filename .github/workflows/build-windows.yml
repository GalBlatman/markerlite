# Builds markerlite.exe on a Windows runner and attaches it to the run.
# Push this repo to GitHub, open Actions, run the workflow, download the
# artifact. No local Windows build needed - useful for handing a binary to
# blog readers who will not install Python.
name: build-windows-exe

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Least privilege: every job reads only. The release job below is the one
# place that may write, and it runs only for a version tag.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Tesseract in its default directory
        run: choco install tesseract --yes --no-progress

      - name: Check generated agent instructions
        shell: bash
        run: |
          python tools/sync_agents.py
          git diff --exit-code AGENTS.md

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-lock.txt -e ".[dev,gui,build]"

      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$(python -c 'import markerlite; print(markerlite.__version__)')" = "${GITHUB_REF_NAME#v}"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Discover Tesseract without PATH
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'Tesseract-OCR|chocolatey\\bin' }) -join ';'
          if (Get-Command tesseract -ErrorAction SilentlyContinue) { throw "tesseract unexpectedly remains on PATH" }
          python markerlite_gui.py --diag
          $want = "markerlite $(python -c "import markerlite; print(markerlite.__version__)")"
          $first = Get-Content markerlite-diag.txt -TotalCount 1
          if ($first -ne $want) { throw "diag first line is '$first', expected '$want'" }
          Select-String -Path markerlite-diag.txt -Pattern "tesseract.*path=.*Tesseract-OCR"
          python -c "import pathlib,tempfile,markerlite; d=tempfile.TemporaryDirectory(); _,i=markerlite.convert(pathlib.Path('tests/fixtures/scanned.pdf'), pathlib.Path(d.name)); assert i['stats']['ocr_pages'] == 2; assert i['stats']['words'] > 100"
          Remove-Item markerlite-diag.txt

      - name: Check GUI method references
        run: python check_gui.py

      - name: Fixture regression
        # Converts tests/fixtures/*.pdf and diffs against tests/expected/.
        # Tesseract is installed above, so Windows also checks OCR output.
        run: python tests/regress.py

      - name: Golden fixture hashes
        run: python tests/golden.py verify --scope fixtures

      - name: Build
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name markerlite `
            --collect-all tkinterdnd2 `
            --collect-submodules sklearn `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            --add-data "markerlite.py;." `
            --add-data "markerlite/VERSION;markerlite" `
            --add-data "table_recon.py;." `
            markerlite_gui.py

      - name: Smoke test the converter
        run: python -c "import markerlite; print('import ok')"

      - name: Check the build launches
        run: |
          if (!(Test-Path dist\markerlite\markerlite.exe)) { throw "exe missing" }
          $diag = Start-Process -FilePath dist\markerlite\markerlite.exe -ArgumentList "--diag" -Wait -PassThru
          if ($diag.ExitCode -ne 0) { throw "diagnostics exited $($diag.ExitCode)" }
          if (!(Test-Path dist\markerlite\markerlite-diag.txt)) { throw "diagnostics missing" }
          Select-String -Path dist\markerlite\markerlite-diag.txt -Pattern "frozen=True", "TkinterDnD.Tk\(\)  OK"
          # The windowed exe has no console: its version is read from the
          # first line of the diagnostics file, never from exe --version.
          $want = "markerlite $(python -c "import markerlite; print(markerlite.__version__)")"
          $first = Get-Content dist\markerlite\markerlite-diag.txt -TotalCount 1
          if ($first -ne $want) { throw "frozen diag first line is '$first', expected '$want'" }

      - name: Check embedded icon resources
        run: python tools/check_exe_icon.py dist\markerlite\markerlite.exe assets\icon.ico

      - name: Ship license texts with the build
        # Apache-2.0 requires the license and NOTICE to accompany redistributions.
        run: |
          Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md -Destination dist\markerlite\
          New-Item -ItemType Directory -Force dist\markerlite\third_party\marker | Out-Null
          Copy-Item third_party\marker\LICENSE -Destination dist\markerlite\third_party\marker\

      - name: Zip the folder build
        run: Compress-Archive -Path dist\markerlite -DestinationPath markerlite-windows.zip

      - name: Write the release notes
        # This version's CHANGELOG section; fails if there is none. The
        # release job checks out nothing, so the notes travel with the zip.
        run: python tools/release_notes.py release-notes.md

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: markerlite-windows
          path: |
            markerlite-windows.zip
            release-notes.md
          if-no-files-found: error

  # A run artifact is not a download link: it expires and needs a GitHub
  # login to fetch. On a version tag, attach the zip to a Release so the
  # Releases page carries something a reader can actually click. This job
  # alone holds contents: write. It checks out nothing: it downloads the zip
  # the build job produced and checks that the version bundled in it matches
  # the tag before publishing.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: markerlite-windows

      - name: Check the bundled version against the tag
        shell: bash
        run: |
          # Read VERSION from the zip whichever separator the archiver used.
          bundled="$(python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("markerlite-windows.zip")
          names = [n for n in z.namelist() if n.replace("\\", "/").endswith("_internal/markerlite/VERSION")]
          assert len(names) == 1, names
          print(z.read(names[0]).decode("ascii").strip())
          PY
          )"
          test "$bundled" = "${GITHUB_REF_NAME#v}" || { echo "bundled $bundled, tag $GITHUB_REF_NAME"; exit 1; }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Idempotent: if a release for this tag already exists (created by
          # hand, or by an earlier attempt), replace its zip and notes rather
          # than fail.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" markerlite-windows.zip --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" markerlite-windows.zip --title "markerlite $tag" --notes-file release-notes.md --latest
          fi
